<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html,body { margin:0; height:100%; background:transparent; font-family: Segoe UI, sans-serif; overflow:hidden; }
  .wrap {
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #0f1115 0%, #1a1d24 100%);
    border:1px solid #2a2f3a; border-radius:16px; color:#e8ebf0;
  }
  .logo {
    width:72px; height:72px; border-radius:18px; background:#1a1d24; border:2px solid #2a2f3a;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:28px; color:#4f8cff;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .logo span { border:2px solid #4f8cff; padding:6px 8px; border-radius:8px; }
  h1 { margin:16px 0 4px; font-size:18px; letter-spacing:0.06em; }
  p { margin:0; font-size:12px; color:#9aa3b2; }
  .bar { margin-top:18px; width:180px; height:4px; background:#22262f; border-radius:99px; overflow:hidden; border:1px solid #2a2f3a; }
  .fill { height:100%; width:30%; background: linear-gradient(90deg, #4f8cff, #6a5cff); border-radius:99px;
    animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-40px); } 50% { transform: translateX(120px); } 100% { transform: translateX(-40px); } }
  .hint { margin-top:10px; font-size:10px; color:#6b7280; letter-spacing:0.04em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><span>CM</span></div>
    <h1>CaptionManager</h1>
    <p>Starting… portable bundle is unpacking</p>
    <div class="bar"><div class="fill"></div></div>
    <div class="hint">First launch may take 5–10s (AV scan)</div>
  </div>
</body>
</html>
